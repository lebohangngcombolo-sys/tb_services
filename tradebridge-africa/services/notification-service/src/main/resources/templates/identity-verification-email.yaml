templateCode: identity.verification
channel: EMAIL
languageCode: en
subject: "Verify your TradeBridge Africa account"
body: |
  <p>Hi,</p>
  <p>Your verification code is:</p>
  <p><b style="font-size:24px;letter-spacing:4px;">${otpCode}</b></p>
  <p>This code expires in ${expiryMinutes} minutes.</p>
  <p>If you did not request this code, you can ignore this email.</p>
  <p>— TradeBridge Africa</p>
variables:
  otpCode: "string, 6 digits"
  expiryMinutes: "string, minutes"