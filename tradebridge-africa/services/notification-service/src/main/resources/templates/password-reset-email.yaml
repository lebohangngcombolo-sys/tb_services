templateCode: identity.password.reset
channel: EMAIL
languageCode: en
subject: "Reset your TradeBridge Africa password"
body: |
  <p>Hi,</p>
  <p>Your password reset code is:</p>
  <p><b style="font-size:24px;letter-spacing:4px;">${otpCode}</b></p>
  <p>This code expires in ${expiryMinutes} minutes.</p>
  <p>If you did not request a reset, please secure your account immediately.</p>
  <p>— TradeBridge Africa</p>
variables:
  otpCode: "string, 6 digits"
  expiryMinutes: "string, minutes"