spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/tb_notification_db
    username: postgres
    password: stenaman
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000


logging:
  level:
    com.tradebridge.notification: DEBUG

tradebridge:
  observability:
    logging:
      json: false
  notification:
    providers:
      sms:
        enabled: false     # SMS off locally (no live API keys)
      email:
        enabled: true
        from-address: ${SMTP_FROM:${SMTP_USER:}}
        from-name: "TradeBridge Africa"
