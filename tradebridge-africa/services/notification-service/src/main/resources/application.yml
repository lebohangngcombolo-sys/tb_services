server:
  port: 8083
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: notification-service

  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/tb_notification_db}
    username: ${NOTIFICATION_DB_USER:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:stenaman}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    placeholder-replacement: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}


  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000


  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

tradebridge:
  observability:
    service-name: notification-service
    environment: ${ENVIRONMENT:local}
    logging:
      json: true
    correlation:
      enabled: true

  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8081}
      audience: ${JWT_AUDIENCE:tradebridge-clients}
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    permissions:
      hierarchy:
        SUPER_ADMIN: ["ADMIN"]
        ADMIN: ["SUPPORT"]

  messaging:
    outbox:
      enabled: true
      poll-interval: 5s
      batch-size: 100
      max-attempts: 5
      topic-per-service: notification.events
    inbox:
      enabled: true
      retention: 30d
    retry:
      max-attempts: 5
      initial-backoff: 1s
      max-backoff: 30s
      multiplier: 2.0
    dlq:
      enabled: true
      suffix: ".dlq"

  notification:
    producer-service-name: notification-service
    internal-secret: ${INTERNAL_SERVICE_SECRET:${NOTIFICATION_INTERNAL_SECRET:${IDENTITY_INTERNAL_SECRET:local-dev-internal-secret-change-in-prod}}}
    retry:
      max-attempts: 5
      initial-backoff: 30s
      max-backoff: 30m
      multiplier: 2.0
      poll-ms: 60000
    bulk:
      max-batch-size: 500
    providers:
      email:
        enabled: true
        from-address: ${SMTP_FROM:${SMTP_USER:}}
        from-name: "TradeBridge Africa"
      sms:
        enabled: ${SMS_ENABLED:true}
        primary: "africastalking"
        africastalking:
          username: ${AT_USERNAME:}
          api-key: ${AT_API_KEY:}
          sender-id: ${AT_SENDER_ID:TradeBridge}
        twilio:
          account-sid: ${TWILIO_ACCOUNT_SID:}
          auth-token: ${TWILIO_AUTH_TOKEN:}
          from-number: ${TWILIO_FROM_NUMBER:}
      inapp:
        enabled: true
    identity-service:
      base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
