server:
  port: 8084
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: customer-service

  datasource:
    url: ${CUSTOMER_DB_URL:jdbc:postgresql://localhost:5432/tb_customer_db}
    username: ${CUSTOMER_DB_USER:postgres}
    password: ${CUSTOMER_DB_PASSWORD:stenaman}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: customer-service
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

tradebridge:
  observability:
    service-name: customer-service
    environment: ${ENVIRONMENT:local}
    logging:
      json: true
    correlation:
      enabled: true

  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8081}
      audience: ${JWT_AUDIENCE:tradebridge-clients}
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    permissions:
      hierarchy:
        SUPER_ADMIN: ["ADMIN"]
        ADMIN: ["KYC_ANALYST", "KYC_SUPERVISOR", "COMPLIANCE_OFFICER", "SUPPORT"]
        KYC_SUPERVISOR: ["KYC_ANALYST"]

  messaging:
    outbox:
      enabled: true
      poll-interval: 5s
      batch-size: 100
      max-attempts: 5
      topic-per-service: customer.events
    inbox:
      enabled: true
      retention: 30d
    retry:
      max-attempts: 5
      initial-backoff: 1s
      max-backoff: 30s
      multiplier: 2.0
    dlq:
      enabled: true
      suffix: ".dlq"

  customer:
    producer-service-name: customer-service
    country-service:
      base-url: ${COUNTRY_SERVICE_URL:http://localhost:8082}
      cache-ttl: 5m
    identity-service:
      base-url: ${IDENTITY_SERVICE_URL:http://localhost:8081}
    documents:
      storage: minio
      max-file-size-bytes: 52428800
      allowed-mime-types:
        - application/pdf
        - image/jpeg
        - image/png
      upload-url-expiry: 15m
    ownership:
      default-threshold: 25.0
    kyc:
      second-reviewer-risk-levels:
        - HIGH
        - CRITICAL

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:tradebridge}
    secret-key: ${MINIO_SECRET_KEY:tradebridge-minio-secret}
    bucket: ${MINIO_BUCKET:tb-kyc-documents}
    region: ${MINIO_REGION:us-east-1}
