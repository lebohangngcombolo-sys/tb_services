server:
  port: 8082
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: country-service

  datasource:
    url: ${COUNTRY_DB_URL:jdbc:postgresql://localhost:5432/tb_country_db}
    username: ${COUNTRY_DB_USER:postgres}
    password: ${COUNTRY_DB_PASSWORD:stenaman}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  cache:
    type: redis
    redis:
      time-to-live: 5m
      cache-null-values: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: country-service
      auto-offset-reset: earliest

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${IDENTITY_JWKS_URI:http://localhost:8081/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

tradebridge:
  observability:
    service-name: country-service
    environment: ${ENVIRONMENT:local}
    logging:
      json: true
    correlation:
      enabled: true

  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8081}
      audience: ${JWT_AUDIENCE:tradebridge-clients}
      jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    permissions:
      hierarchy:
        SUPER_ADMIN: ["ADMIN"]
        ADMIN: ["KYC_ANALYST", "KYC_SUPERVISOR", "COMPLIANCE_OFFICER", "SUPPORT"]

  messaging:
    outbox:
      enabled: true
      poll-interval: 5s
      batch-size: 100
      max-attempts: 5
      topic-per-service: country.events
    inbox:
      enabled: true
      retention: 30d
    retry:
      max-attempts: 5
      initial-backoff: 1s
      max-backoff: 30s
      multiplier: 2.0
    dlq:
      enabled: true
      suffix: ".dlq"

  country:
    producer-service-name: country-service
    cache:
      ttl: 5m
    config-publish:
      require-prior-draft: true
